version: 2
updates:
  # One grouped PR a week each, so updates stay visible without becoming noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # TypeScript 7 is blocked by @astrojs/check, whose peer range is
      # ^5 || ^6 as of 0.9.9 (the latest release). npm ci fails on the
      # conflict. Drop this entry once @astrojs/check supports TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

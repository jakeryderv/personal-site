name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CI has no .dev.vars, but `wrangler types` needs the secret's name to
      # generate a complete Env for `npm run check`. This is Cloudflare's
      # documented always-pass Turnstile test secret, not a real credential.
      - run: echo 'TURNSTILE_SECRET_KEY="1x0000000000000000000000000000000AA"' > .dev.vars
      - run: npx wrangler types
      - run: npm run test
      - run: npm run check

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d4e3fe7d69a3ac8f446d4c3de2ca051b
